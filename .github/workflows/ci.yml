name: CI - Build & Push Docker Image
on:
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: demo-env

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION | \
        docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

    - name: Build Docker Image
      run: |
        docker build -t simple-microservice .

    - name: Tag Image
      run: |
        docker tag simple-microservice:latest ${{ secrets.ECR_REPOSITORY_URI }}:latest

    - name: Push Image to ECR
      run: |
        docker push ${{ secrets.ECR_REPOSITORY_URI }}:latest
